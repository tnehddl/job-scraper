<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Job Scraper</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 20px;
    }

    header {
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 32px;
    }

    form {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      min-width: 170px;
      padding: 2px 4px;
    }

    #message {
      margin: 14px 0 0;
    }

    #message.error {
      color: orange;
    }

    table {
      margin-top: 12px;
      border-collapse: collapse;
    }

    th,
    td {
      vertical-align: top;
    }

    .results-wrap {
      max-width: 100%;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>Job Scraper</h1>
    <form id="searchForm">
      <input
        type="text"
        name="keyword"
        id="keyword"
        placeholder="python, javascript, java ..."
        required
      >
      <button type="submit">Search</button>
    </form>
  </header>

  <main>
    <p id="message"></p>
    <div id="results" class="results-wrap"></div>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const keywordInput = document.getElementById("keyword");
    const message = document.getElementById("message");
    const results = document.getElementById("results");

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function renderTable(jobs) {
      const table = document.createElement("table");
      table.setAttribute("border", "1");
      table.setAttribute("cellpadding", "6");
      table.setAttribute("cellspacing", "0");

      const thead = document.createElement("thead");
      thead.innerHTML = "<tr><th>Title</th><th>Company</th><th>Source</th><th>Link</th></tr>";
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      jobs.forEach((job) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${escapeHtml(job.title || "")}</td>
          <td>${escapeHtml(job.company || "")}</td>
          <td>${escapeHtml(job.source || "")}</td>
          <td><a href="${escapeHtml(job.link || "#")}" target="_blank" rel="noopener">Apply</a></td>
        `;
        tbody.appendChild(row);
      });

      table.appendChild(tbody);
      return table;
    }

    function showResults(data, keyword) {
      results.innerHTML = "";
      message.className = "";

      const jobs = Array.isArray(data.jobs) ? data.jobs : [];
      const finalKeyword = data.keyword || keyword;

      if (data.error) {
        message.textContent = data.error;
        message.className = "error";
        return;
      }

      if (!jobs.length) {
        message.textContent = `No results for "${finalKeyword}".`;
        return;
      }

      message.textContent = `${jobs.length} results for "${finalKeyword}"`;
      results.appendChild(renderTable(jobs));
    }

    async function runSearch(keyword) {
      const response = await fetch(
        `/search?keyword=${encodeURIComponent(keyword)}&format=json`,
        { headers: { Accept: "application/json" } }
      );
      if (!response.ok) {
        throw new Error("Search request failed");
      }
      return response.json();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const keyword = keywordInput.value.trim();
      if (!keyword) return;

      history.replaceState(null, "", `?keyword=${encodeURIComponent(keyword)}`);
      message.className = "";
      message.textContent = "Loading...";
      results.innerHTML = "";

      try {
        const data = await runSearch(keyword);
        showResults(data, keyword);
      } catch (error) {
        results.innerHTML = "";
        message.textContent = "Search results are available when the Flask app is running.";
        message.className = "error";
      }
    });

    const initialKeyword = new URLSearchParams(window.location.search).get("keyword") || "";
    if (initialKeyword) {
      keywordInput.value = initialKeyword;
      form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
    }
  </script>
</body>
</html>
